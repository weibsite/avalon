<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿瓦隆助手 (角色攻略 + 互動計分板)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* * 自訂樣式 (保留 Tailwind 無法輕易達成的部分)
         */
        :root {
            --good-color: #2563eb; /* 藍色 (Tailwind blue-600) */
            --evil-color: #dc2626; /* 紅色 (Tailwind red-600) */
            --success-color: #16a34a; /* 綠色 (Tailwind green-600) */
            --fail-color: #1f2937;    /* 黑色 (Tailwind gray-800) */
            --bg-light: #f3f4f6;
            --bg-dark: #1f2937;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--bg-light);
            perspective: 2000px;
            transition: background-color 0.6s;
        }

        /* 隱藏/顯示的切換 */
        .hidden {
            display: none !important;
        }

        /* --- 1. 角色攻略 (翻牌效果) --- */
        #character-info-scene {
            display: block;
            width: 100%;
            padding-top: 20px;
        }
        .flip-card {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            min-height: 600px;
        }
        .flip-card-inner.is-flipped {
            transform: rotateY(180deg);
        }
        .flip-card-front,
        .flip-card-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        .flip-card-front {
            background-color: #000;
        }
        .flip-card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.75rem;
        }
        .flip-card-back {
            background-color: var(--card-bg);
            transform: rotateY(180deg);
            padding: 30px;
            box-sizing: border-box;
            overflow-y: auto;
            height: 100%; 
        }

        .good-title { color: var(--good-color); border-color: var(--good-color); }
        .evil-title { color: var(--evil-color); border-color: var(--evil-color); }

        .info-section ul { list-style-type: none; padding-left: 0; }
        .info-section li {
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 12px;
            padding-left: 25px;
            position: relative;
        }
        .info-section li::before {
            content: '🔹';
            position: absolute;
            left: 0;
            top: 2px;
            font-size: 14px;
        }
        .evil-title + .info-section + .info-section li::before,
        .evil-title + .info-section + .info-section + .info-section li::before {
            content: '🔺';
        }

        /* --- 2. 計分板 --- */

        /* 玩家籌碼 (可拖曳) */
        .player-token {
            width: 45px;
            height: 45px;
            line-height: 45px;
            text-align: center;
            font-weight: bold;
            color: white;
            background-color: #4b5563; /* gray-600 */
            border-radius: 50%;
            cursor: grab;
            user-select: none;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-size: 14px;
            /* 【修正】防止在 iOS 上長按時觸發預設選單 */
            -webkit-touch-callout: none;
        }
        .player-token:active {
            cursor: grabbing;
            opacity: 0.7;
        }
        /* 玩家顏色 */
        .player-token[data-player="P1"] { background-color: #ef4444; } /* red-500 */
        .player-token[data-player="P2"] { background-color: #3b82f6; } /* blue-500 */
        .player-token[data-player="P3"] { background-color: #22c55e; } /* green-500 */
        .player-token[data-player="P4"] { background-color: #eab308; } /* yellow-500 */
        .player-token[data-player="P5"] { background-color: #a855f7; } /* purple-500 */
        .player-token[data-player="P6"] { background-color: #f97316; } /* orange-500 */
        .player-token[data-player="P7"] { background-color: #06b6d4; } /* cyan-500 */
        .player-token[data-player="P8"] { background-color: #ec4899; } /* pink-500 */
        .player-token[data-player="P9"] { background-color: #64748b; } /* slate-500 */
        .player-token[data-player="P10"] { background-color: #84cc16; } /* lime-500 */


        /* 5x5 座位網格 */
        .grid-cell {
            border: 2px dashed #d1d5db; /* gray-300 */
            border-radius: 0.375rem; /* rounded-md */
            background-color: #fff;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            flex-wrap: wrap; 
            gap: 2px;
        }
        .grid-cell.drag-over {
            background-color: #e0f2fe; /* sky-100 */
            border-color: var(--good-color);
        }

        /* 右上角鎖定後的小地圖 */
        #mini-seating-layout-container {
            position: absolute; /* 【修改】還原為 absolute，使其隨頁面捲動 */
            top: 1.5rem; /* 24px */
            right: 1.5rem; /* 24px */
            z-index: 10;
        }
        #mini-seating-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 3px;
            border: 1px solid #9ca3af; /* gray-400 */
            background-color: #f9fafb; /* gray-50 */
            padding: 5px;
            border-radius: 4px;
        }
        .mini-grid-cell {
            width: 30px;
            height: 30px;
            border-radius: 2px;
            background-color: #e5e7eb; /* gray-200 */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mini-grid-cell .player-token {
            width: 26px;
            height: 26px;
            line-height: 26px;
            font-size: 11px;
            border: none;
            box-shadow: none;
        }

        /* 當座位鎖定時，隱藏主網格 */
        #scoreboard-section.seating-locked .seating-section,
        #scoreboard-section.seating-locked .setup-section {
            display: none;
        }
        /* 當未鎖定時，隱藏小地圖和解鎖按鈕 */
        #scoreboard-section:not(.seating-locked) #mini-seating-layout-container,
        #scoreboard-section:not(.seating-locked) #unlock-layout-btn {
            display: none;
        }
        
        /* 遊戲進程記錄 */
        /* 玩家選擇按鈕 (新) */
        .player-button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .player-btn {
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 9999px; /* rounded-full */
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
            background-color: #e5e7eb; /* gray-200 */
            color: #374151; /* gray-700 */
            /* 【新增】防止手機長按時觸發選單 */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        .player-btn:hover {
            background-color: #d1d5db; /* gray-300 */
        }

        /* 隊長 */
        .player-btn.leader.selected {
            background-color: #f59e0b; /* amber-500 */
            color: white;
            border-color: #b45309; /* amber-700 */
        }
        /* 隊員 */
        .player-btn.team.selected {
            background-color: var(--good-color);
            color: white;
        }
        /* 隊員 (被禁止) */
        .player-btn.team.disabled {
            background-color: #f3f4f6; /* gray-100 */
            color: #9ca3af; /* gray-400 */
            cursor: not-allowed;
            text-decoration: line-through;
        }

        /* 贊成 (投票) */
        .player-btn.vote.selected {
            background-color: var(--success-color);
            color: white;
        }
        /* 失敗 (任務) */
        .player-btn.mission.selected-fail {
            background-color: var(--fail-color);
            color: white;
        }
        /* 成功 (任務) */
        .player-btn.mission.selected-success {
            background-color: #eab308; /* yellow-500 */
            color: #1f2937;
        }

        /* 投票結果顯示 */
        .vote-result-display {
            font-size: 1.125rem; /* text-lg */
            font-weight: 700; /* bold */
            padding: 0.5rem 1rem; /* py-2 px-4 */
            border-radius: 0.375rem; /* rounded-md */
            text-align: center;
        }
        .vote-result-display.pass {
            background-color: #dcfce7; /* green-100 */
            color: #15803d; /* green-700 */
        }
        .vote-result-display.fail {
            background-color: #fee2e2; /* red-100 */
            color: #b91c1c; /* red-700 */
        }
        .vote-result-display.tie {
            background-color: #fef3c7; /* yellow-100 */
            color: #a16207; /* yellow-700 */
        }

        /* 任務結果顯示 */
        .mission-result-display {
            font-size: 1.25rem; /* text-xl */
            font-weight: 700; /* bold */
            padding: 0.75rem 1rem; /* py-3 px-4 */
            border-radius: 0.375rem; /* rounded-md */
            text-align: center;
        }
        .mission-result-display.pass {
            background-color: #dbeafe; /* blue-100 */
            color: var(--good-color);
        }
        .mission-result-display.fail {
            background-color: #fecaca; /* red-100 */
            color: var(--evil-color);
        }

        /* --- 響應式調整 --- */
        @media (max-width: 768px) {
            body { padding: 0; }
            .container { padding: 10px; }
            .nav-link { padding: 10px 12px; font-size: 16px; }

            .flip-card-inner { min-height: 100vh; border-radius: 0; }
            .flip-card-front, .flip-card-back {
                border-radius: 0;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                height: 100%;
            }
            .flip-card-back { padding: 25px 20px 30px 20px; }
            #back-button { width: 100%; }

            /* 計分板響應式 */
            #scoreboard-section { padding: 15px; }
            .grid-cell { min-height: 45px; }
            .player-token { width: 35px; height: 35px; line-height: 35px; font-size: 12px; }
            
            #mini-seating-layout-container {
                position: static; /* 【修改】還原為 static，使其在手機上位於內容頂部 */
                margin-bottom: 1.5rem; /* 24px */
                top: auto; /* 清除 fixed 留下的屬性 */
                right: auto; /* 清除 fixed 留下的屬性 */
            }
            #mini-seating-grid {
                max-width: 300px; /* 限制寬度 */
                margin: 0 auto; /* 置中 */
            }
            .mini-grid-cell { width: 100%; aspect-ratio: 1/1; height: auto; } /* 變為彈性 */
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="container max-w-5xl mx-auto p-5">
        
        <!-- 分頁導覽 -->
        <div class="flex justify-center mb-6 border-b-2 border-gray-200">
            <button class="nav-link py-3 px-6 text-lg font-semibold text-gray-500 relative top-0.5 transition-colors" data-tab="role-guide">角色攻略</button>
            <button class="nav-link py-3 px-6 text-lg font-semibold text-gray-500 relative top-0.5 transition-colors" data-tab="scoreboard">遊戲計分板</button>
        </div>

        <!-- 1. 角色攻略 -->
        <div id="role-guide-section">
            <div id="character-selection">
                <h1 class="text-3xl font-bold text-center text-indigo-900 mb-6">阿瓦隆 角色攻略</h1>
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-5" id="card-grid-container">
                    <!-- JS 會填充角色卡 -->
                </div>
            </div>

            <div id="character-info-scene" class="hidden">
                <div class="flip-card" id="flip-card">
                    <div class="flip-card-inner" id="flip-card-inner">
                        
                        <div class="flip-card-front" id="info-card-front">
                            <!-- JS 會填充圖片 -->
                        </div>
                        
                        <div class="flip-card-back">
                            <h2 id="role-name" class="text-3xl font-bold mb-5 pb-3 border-b-3"></h2>
                
                            <div class="info-section mb-6" id="role-knowledge-section">
                                <h3 class="text-xl font-semibold text-gray-700 mb-2">你知道什麼：</h3>
                                <p id="role-knowledge" class="text-base leading-relaxed bg-gray-50 p-4 rounded-lg border-l-4 border-gray-300"></p>
                            </div>
                            
                            <div class="info-section mb-6" id="role-notes-section">
                                <h3 class="text-xl font-semibold text-gray-700 mb-2">個人筆記：</h3>
                                <textarea id="role-notes-textarea" placeholder="在這裡記錄玩家的可能性、場上局勢... (內容會自動儲存)" class="w-full min-h-[150px] border-2 border-gray-300 rounded-lg p-3 text-sm font-mono focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-y"></textarea>
                            </div>

                            <div class="info-section mb-6" id="role-strategy-section">
                                <h3 class="text-xl font-semibold text-gray-700 mb-3">玩法攻略：</h3>
                                <ul id="role-strategy-list" class="space-y-3">
                                    <!-- JS 會填充攻略 -->
                                </ul>
                            </div>
                            
                            <button id="back-button" class="mt-6 w-full py-3 px-6 text-base font-bold bg-gray-600 text-white rounded-lg transition-colors hover:bg-gray-700">
                                返回角色選擇
                            </button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
        
        <!-- 2. 遊戲計分板 (全新功能) -->
        <div id="scoreboard-section" class="hidden relative bg-white p-6 rounded-xl shadow-lg">

            <!-- 鎖定後顯示的小地圖 (右上角) -->
            <div id="mini-seating-layout-container">
                <h4 class="font-semibold text-center text-sm mb-1">座位佈局</h4>
                <div id="mini-seating-grid">
                    <!-- JS 會根據鎖定佈局填充 -->
                </div>
                <button id="unlock-layout-btn" class="w-full mt-2 py-1 px-2 text-xs font-medium bg-yellow-500 text-white rounded hover:bg-yellow-600">
                    解鎖佈局
                </button>
            </div>


            <!-- 玩家設置 -->
            <div class="setup-section mb-8">
                <h2 class="text-2xl font-bold text-gray-800 border-b border-gray-200 pb-2 mb-4">1. 玩家設置</h2>
                <div class="flex flex-col sm:flex-row items-center gap-4 mb-4">
                    <label for="player-count" class="font-semibold">玩家人數 (5-10):</label>
                    <input type="number" id="player-count" value="5" min="5" max="10" class="w-20 p-2 text-center border-2 border-gray-300 rounded-md">
                    <button id="generate-players-btn" class="py-2 px-5 font-semibold bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                        產生玩家籌碼
                    </button>
                </div>
                <div id="player-token-bank-container">
                    <h4 class="font-semibold mb-2">可拖曳的玩家籌碼 (請拖到下方格子)：</h4>
                    <div id="player-token-bank" class="flex flex-wrap gap-3 p-4 bg-gray-100 rounded-lg min-h-[60px] border border-dashed border-gray-400">
                        <!-- JS 會填充籌碼 -->
                    </div>
                </div>
            </div>

            <!-- 座位佈局 -->
            <div class="seating-section mb-8">
                <h2 class="text-2xl font-bold text-gray-800 border-b border-gray-200 pb-2 mb-4">2. 座位佈局 (5x5 彈性網格)</h2>
                <div id="seating-grid" class="grid grid-cols-5 gap-2 border-2 border-gray-200 bg-gray-50 p-3 rounded-lg max-w-xl mx-auto">
                    <!-- JS 會產生 25 個格子 -->
                </div>
                <button id="lock-layout-btn" class="mt-4 w-full py-3 px-6 text-lg font-bold bg-green-600 text-white rounded-lg transition-colors hover:bg-green-700">
                    鎖定座位佈局
                </button>
            </div>

            <!-- 遊戲進程記錄 -->
            <div class="tracker-section">
                <h2 class="text-2xl font-bold text-gray-800 border-b border-gray-200 pb-2 mb-4">3. 遊戲進程記錄</h2>
                <div class="flex justify-center flex-wrap gap-2 mb-5" id="round-tabs-container">
                    <!-- JS 會產生局數按鈕 -->
                </div>
                
                <div id="round-log-container">
                    <!-- JS 會根據選擇的局數顯示對應的日誌 -->
                </div>
            </div>

        </div>

    </div>

            // --- 5. 核心功能 (角色攻略) ---

            function createCharacterCards() {
                cardGridContainer.innerHTML = '';

            // --- 6. 核心功能 (分頁) ---
            function setupTabs() {
                // 預設選中第一個
                navLinks[0].classList.add('active', 'text-blue-600', 'border-b-3', 'border-blue-600');

                            showSelectionScreen(); // 呼叫此函式來重置狀態 (如 .is-flipped 和背景色)
                        } else {
                            roleGuideSection.classList.add('hidden');

            }
            
            // --- 7. 核心功能 (計分板 - 設置) ---
            
            function initializeScoreboard() {
                seatingGrid.innerHTML = '';
                for (let i = 0; i < 25; i++) {
                    const cell = document.createElement('div');
                    cell.classList.add('grid-cell');
                    cell.dataset.cellId = i;
                    seatingGrid.appendChild(cell);
                }
                
                generatePlayersBtn.addEventListener('click', generatePlayerTokens);
                lockLayoutBtn.addEventListener('click', handleLockLayout);
                unlockLayoutBtn.addEventListener('click', handleUnlockLayout);
                
                setupDragAndDrop(); // 設置拖放 (包含桌面和手機)
                generatePlayerTokens(); // 預設產生 5 位
                // 注意：setupRoundTabs() 和 showRoundLog() 會在鎖定佈局後才調用
            }
            
            function generatePlayerTokens() {
                playerTokenBank.innerHTML = '';
                const count = parseInt(playerCountInput.value, 10);
                activePlayerCount = count;
                currentRules = GAME_RULES[count] || GAME_RULES[5]; // 更新遊戲規則
                
                for (let i = 1; i <= count; i++) {
                    const token = document.createElement('div');
                    const playerId = `P${i}`;
                    token.classList.add('player-token');
                    token.textContent = playerId;
                    token.dataset.player = playerId;
                    token.id = `token-${playerId}`;
                    token.draggable = true; // 保留給桌面
                    playerTokenBank.appendChild(token);
                    
                    // 【修正】為手機添加觸控事件監聽
                    token.addEventListener('touchstart', handleTouchStart, { passive: false });
                }
            }
            
            // --- 【新增】觸控拖曳輔助函式 ---

            function handleTouchStart(e) {
                if (e.target.classList.contains('player-token')) {
                    draggedToken = e.target;
                    originalParent = draggedToken.parentElement;
                    
                    const touch = e.touches[0];
                    const rect = draggedToken.getBoundingClientRect();
                    
                    // 計算觸控點相對於籌碼左上角的偏移
                    touchOffsetX = touch.clientX - rect.left;
                    touchOffsetY = touch.clientY - rect.top;

                    // 設置拖曳時的樣式
                    draggedToken.style.position = 'fixed'; // 使用 fixed 定位，使其脫離文檔流並相對於視窗
                    draggedToken.style.zIndex = '1000';
                    draggedToken.style.opacity = '0.7';
                    draggedToken.style.pointerEvents = 'none'; // 讓 elementFromPoint 可以偵測到下方的元素
                    
                    // 立即更新位置
                    updateTokenPosition(touch);

                    // 綁定全域事件
                    document.addEventListener('touchmove', handleTouchMove, { passive: false });
                    document.addEventListener('touchend', handleTouchEnd);
                    document.addEventListener('touchcancel', handleTouchEnd); // 處理意外中斷
                }
            }
            
            function updateTokenPosition(touch) {
                 if (!draggedToken) return;
                 // 根據觸控位置和偏移量來更新籌碼位置
                 draggedToken.style.left = `${touch.clientX - touchOffsetX}px`;
                 draggedToken.style.top = `${touch.clientY - touchOffsetY}px`;
            }

            function handleTouchMove(e) {
                if (!draggedToken) return;
                
                e.preventDefault(); // 在移動時才防止滾動
                const touch = e.touches[0];
                updateTokenPosition(touch);

                // 尋找觸控點下方的元素
                const elementUnder = document.elementFromPoint(touch.clientX, touch.clientY);
                const dropTarget = elementUnder ? elementUnder.closest('.grid-cell, #player-token-bank') : null;

                // 清除上一個目標的 'drag-over' 樣式
                if (lastValidTarget && lastValidTarget !== dropTarget) {
                    lastValidTarget.classList.remove('drag-over');
                }
                
                // 為新目標添加 'drag-over' 樣式
                if (dropTarget) {
                    dropTarget.classList.add('drag-over');
                    lastValidTarget = dropTarget;
                } else {
                    lastValidTarget = null;
                }
            }
            
            function handleTouchEnd(e) {
                if (!draggedToken) return;

                // 尋找最後觸控點下方的元素
                const touch = e.changedTouches[0];
                // 檢查 touch 是否存在，以防萬一
                if (!touch) {
                    // 如果 touch 事件意外結束 (如 touchcancel)
                    if (originalParent) {
                        originalParent.appendChild(draggedToken);
                    }
                } else {
                    const elementUnder = document.elementFromPoint(touch.clientX, touch.clientY);
                    let dropTarget = elementUnder ? elementUnder.closest('.grid-cell, #player-token-bank') : null;

                    // 如果手指滑太快，elementUnder 可能是 null，嘗試使用 lastValidTarget
                    if (!dropTarget && lastValidTarget) {
                        dropTarget = lastValidTarget;
                    }
                    
                    // 決定籌碼的最終歸屬
                    if (dropTarget) {
                        dropTarget.appendChild(draggedToken);
                    } else {
                        originalParent.appendChild(draggedToken); // 放回原位
                    }
                }


                // 清理 'drag-over' 樣式
                if (lastValidTarget) {
                    lastValidTarget.classList.remove('drag-over');
                }
                
                // 恢復籌碼的樣式
                draggedToken.style.opacity = '1';
                draggedToken.style.position = 'static'; // 恢復靜態定位
                draggedToken.style.zIndex = 'auto';
                draggedToken.style.left = 'auto';
                draggedToken.style.top = 'auto';
                draggedToken.style.pointerEvents = 'auto';


                // 清理全域變數
                draggedToken = null;
                originalParent = null;
                lastValidTarget = null;
                touchOffsetX = 0;
                touchOffsetY = 0;

                // 移除全域事件
                document.removeEventListener('touchmove', handleTouchMove);
                document.removeEventListener('touchend', handleTouchEnd);
                document.removeEventListener('touchcancel', handleTouchEnd);
            }
            // --- 【新增】結束 ---


            function setupDragAndDrop() {
                // --- 1. 桌面 (Mouse) 拖曳事件 (保留) ---
                document.addEventListener('dragstart', (e) => {
                    if (e.target.classList.contains('player-token')) {
                        draggedToken = e.target;
                        e.dataTransfer.setData('text/plain', e.target.id);
                        setTimeout(() => { e.target.style.opacity = '0.5'; }, 0);
                    }
                });

                document.addEventListener('dragend', (e) => {
                    if (draggedToken) {
                        draggedToken.style.opacity = '1';
                        draggedToken = null;
                    }
                     // 清理可能殘留的樣式
                    if(lastValidTarget) {
                        lastValidTarget.classList.remove('drag-over');
                        lastValidTarget = null;
                    }
                });

                [seatingGrid, playerTokenBank].forEach(container => {
                    container.addEventListener('dragover', (e) => {
                        e.preventDefault(); 
                        const targetCell = e.target.closest('.grid-cell, #player-token-bank');
                        
                        // 清理舊的
                        if (lastValidTarget && lastValidTarget !== targetCell) {
                             lastValidTarget.classList.remove('drag-over');
                        }
                        
                        // 標記新的
                        if (targetCell) {
                            targetCell.classList.add('drag-over');
                            lastValidTarget = targetCell;
                        } else {
                            lastValidTarget = null;
                        }
                    });

                    container.addEventListener('dragleave', (e) => {
                        // 當滑鼠離開 *容器* 時，才需要清理
                        const related = e.relatedTarget ? e.relatedTarget.closest('.grid-cell, #player-token-bank') : null;
                         if (lastValidTarget && !related) {
                            lastValidTarget.classList.remove('drag-over');
                            lastValidTarget = null;
                         }
                    });

                    container.addEventListener('drop', (e) => {
                        e.preventDefault();
                        // 使用 lastValidTarget 來確保放置到正確的格子
                        const targetCell = lastValidTarget;
                        
                        if (targetCell && draggedToken) {
                            targetCell.appendChild(draggedToken);
                        }
                        
                        // 清理
                        if (targetCell) {
                            targetCell.classList.remove('drag-over');
                        }
                        if (lastValidTarget) {
                            lastValidTarget.classList.remove('drag-over');
                        }
                        lastValidTarget = null;
                    });
                });
                
                // --- 2. 手機 (Touch) 拖曳事件 ---
                // 監聽器已在 generatePlayerTokens() 中動態綁定到每個籌碼上
                // 全域的 touchmove / touchend 則在 handleTouchStart 中動態添加/移除
            }


            function handleLockLayout() {
                activePlayers = [];
                const gridCells = seatingGrid.querySelectorAll('.grid-cell');
                gridCells.forEach(cell => {
                    const token = cell.querySelector('.player-token');
                    if (token) {
                        activePlayers.push(token.dataset.player);
                    }
                });

                if (activePlayers.length !== activePlayerCount) {
                    alert(`請將所有 ${activePlayerCount} 位玩家都拖曳到 5x5 網格中。`);
                    return;
                }
                
                // 排序玩家
                activePlayers.sort((a, b) => {
                    return parseInt(a.substring(1)) - parseInt(b.substring(1));
                });

                renderMiniLayout();
                scoreboardSection.classList.add('seating-locked');

                // 鎖定後才初始化局數

                    miniSeatingGrid.appendChild(miniCell);

            // --- 8. 核心功能 (計分板 - 遊戲進程) ---

            function setupRoundTabs() {
                roundTabsContainer.innerHTML = '';
                for (let i = 1; i <= 5; i++) {

                    button.addEventListener('click', () => {
                        document.querySelectorAll('#round-tabs-container button').forEach(btn => {
                            btn.classList.remove('active', 'bg-blue-600', 'text-white');
                            btn.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                        });
                        button.classList.add('active', 'bg-blue-600', 'text-white');
                        button.classList.remove('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                        showRoundLog(i);
                    });
                    roundTabsContainer.appendChild(button);
                }
            }

            function showRoundLog(roundNumber) {
                let roundLogEl = document.getElementById(`round-log-${roundNumber}`);
                document.querySelectorAll('.round-log').forEach(log => log.classList.add('hidden'));

                if (!roundLogEl) {
                    const teamSize = currentRules.teamSizes[roundNumber - 1];
                    const failsNeeded = currentRules.failsNeeded[roundNumber - 1];
                    
                    roundLogEl = document.createElement('div');
                    roundLogEl.id = `round-log-${roundNumber}`;
                    roundLogEl.classList.add('round-log', 'border', 'border-gray-200', 'rounded-lg', 'p-5', 'bg-gray-50');
                    
                    roundLogEl.innerHTML = `
                        <h3 class="text-xl font-bold text-center mb-4">
                            第 ${roundNumber} 局 (隊伍人數: ${teamSize})
                            ${failsNeeded > 1 ? `<span class="text-red-600 font-semibold text-sm ml-2">(需 ${failsNeeded} 失敗)</span>` : ''}
                        </h3>
                        <div id="vote-attempts-container-${roundNumber}" class="space-y-6">
                            <!-- JS 會在此添加投票回合 -->
                        </div>
                        <button class="add-vote-attempt-btn mt-6 w-full py-2 px-4 font-semibold text-blue-700 bg-blue-100 rounded-md hover:bg-blue-200 transition-colors" data-round="${roundNumber}">
                            + 新增投票回合 (5 票否決)
                        </button>
                        <div class="mission-result-section mt-6 pt-6 border-t-2 border-dashed border-gray-300 hidden">
                            <h4 class="text-lg font-semibold mb-3">最終任務結果</h4>
                            <div class="log-field mb-3">
                                <label class="block font-medium mb-2">點擊任務失敗 (黑) 的玩家：</label>
                                <div class="player-button-group" data-mode="mission" data-round="${roundNumber}">
                                    <!-- JS 會填充任務隊員 -->
                                </div>
                            </div>
                            <button class="confirm-mission-btn w-full py-2 px-4 font-semibold bg-green-600 text-white rounded-md hover:bg-green-700 transition-colors" data-round="${roundNumber}" data-fails-needed="${failsNeeded}">
                                確認任務結果
                            </button>
                            <div class="mission-result-display mt-4 hidden"></div>
                        </div>
                    `;
                    roundLogContainer.appendChild(roundLogEl);
                    
                    roundLogEl.querySelector('.add-vote-attempt-btn').addEventListener('click', () => {
                        addVoteAttempt(roundNumber);
                    });
                    
                    // 綁定動態生成的按鈕
                    roundLogEl.addEventListener('click', handlePlayerButtonClick);
                    roundLogEl.addEventListener('click', handleConfirmVoteClick);
                    roundLogEl.addEventListener('click', handleConfirmMissionClick);
                    
                    addVoteAttempt(roundNumber); // 預設新增一個
                }

                roundLogEl.classList.remove('hidden');
            }

            function addVoteAttempt(roundNumber) {
                const container = document.getElementById(`vote-attempts-container-${roundNumber}`);
                const attemptCount = container.children.length + 1;
                
                // 5 票否決
                if (attemptCount > 5) {
                    alert('已經 5 次投票失敗，任務自動失敗！');
                    // 可以在這裡自動標記任務失敗
                    return;
                }
                
                const teamSize = currentRules.teamSizes[roundNumber - 1];

                const attemptEl = document.createElement('div');
                attemptEl.classList.add('vote-attempt', 'border', 'border-gray-300', 'p-4', 'rounded-lg', 'bg-white', 'shadow-sm');
                attemptEl.dataset.attempt = attemptCount;
                
                attemptEl.innerHTML = `
                    <h4 class="text-lg font-semibold mb-3 border-b border-gray-200 pb-2">第 ${attemptCount} 次投票</h4>
                    
                    <!-- 1. 選隊長 -->
                    <div class="log-field mb-3">
                        <label class="block font-medium mb-2">選擇隊長 (King):</label>
                        <div class="player-button-group" data-mode="leader">
                            ${createPlayerButtons(activePlayers, 'leader')}
                        </div>
                    </div>
                    
                    <!-- 2. 選隊員 -->
                    <div class="log-field mb-3">
                        <label class="block font-medium mb-2">選擇隊員 (上限 ${teamSize} 人):</label>
                        <div class="player-button-group" data-mode="team" data-limit="${teamSize}">
                            ${createPlayerButtons(activePlayers, 'team')}
                        </div>
                    </div>

                    <!-- 3. 投票 -->
                    <div class="log-field mb-3">
                        <label class="block font-medium mb-2">點擊投「贊成」 (綠) 的玩家：</label>
                        <div class="player-button-group" data-mode="vote">
                            ${createPlayerButtons(activePlayers, 'vote')}
                        </div>
                    </div>
                    
                    <!-- 4. 確認投票 -->
                    <button class="confirm-vote-btn w-full py-2 px-4 font-semibold bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors" data-round="${roundNumber}" data-attempt="${attemptCount}">
                        確認投票結果
                    </button>
                    <div class="vote-result-display mt-4 hidden"></div>
                `;
                
                container.appendChild(attemptEl);

                // 更新 "新增按鈕" 的文字
                const addBtn = container.nextElementSibling;
                if (addBtn && addBtn.classList.contains('add-vote-attempt-btn')) {
                    addBtn.textContent = `+ 新增投票回合 (${attemptCount} 票否決)`;
                    if(attemptCount === 5) {
                        addBtn.textContent = '第 5 票否決，任務失敗';
                        addBtn.disabled = true;
                        addBtn.classList.add('bg-red-100', 'text-red-700', 'cursor-not-allowed');
                    }
                }
            }

            function createPlayerButtons(players, mode) {
                return players.map(player => 
                    `<button class="player-btn ${mode}" data-player="${player}" data-mode="${mode}">${player}</button>`
                ).join('');
            }

            // --- 9. 核心功能 (計分板 - 事件處理) ---

            function handlePlayerButtonClick(e) {
                const button = e.target.closest('.player-btn');
                if (!button) return;

                const { mode, player } = button.dataset;
                const group = button.parentElement;
                
                // 防呆：如果按鈕被禁用 (如已選隊長)
                if (button.classList.contains('disabled')) {
                    return;
                }

                if (mode === 'leader') {
                    // 單選
                    group.querySelectorAll('.player-btn').forEach(btn => btn.classList.remove('selected'));
                    button.classList.add('selected');

                    // 連動更新「隊員」區
                    const voteAttemptEl = button.closest('.vote-attempt');
                    const teamGroup = voteAttemptEl.querySelector('.player-button-group[data-mode="team"]');
                    const teamLimit = parseInt(teamGroup.dataset.limit, 10);
                    
                    // 清空舊的
                    teamGroup.querySelectorAll('.player-btn').forEach(btn => {
                        btn.classList.remove('selected', 'disabled');
                    });

                    // 選中並禁用隊長
                    const leaderInTeam = teamGroup.querySelector(`.player-btn[data-player="${player}"]`);
                    if (leaderInTeam) {
                        leaderInTeam.classList.add('selected', 'disabled');
                    }
                }
                
                if (mode === 'team') {
                    const teamLimit = parseInt(group.dataset.limit, 10);
                    const selectedCount = group.querySelectorAll('.selected').length;

                    if (button.classList.contains('selected')) {
                        // 取消選中 (不應發生在隊長身上)
                        button.classList.remove('selected');
                    } else {
                        // 選中
                        if (selectedCount < teamLimit) {
                            button.classList.add('selected');
                        } else {
                            alert(`隊伍人數已達上限 ${teamSize} 人！`);
                        }
                    }
                }

                if (mode === 'vote') {
                    // 多選
                    button.classList.toggle('selected');
                }

                if (mode === 'mission') {
                    // 【修改】點擊任一玩家，切換 *所有* 玩家的狀態 (成功/失敗)
                    const allButtons = group.querySelectorAll('.player-btn');
                    
                    // 檢查 *目前* 的狀態 (以被點擊的按鈕為準)
                    // 如果當前是 'fail'，則全部變 'success'。
                    // 否則 (是 'success' 或 '預設')，則全部變 'fail'。
                    const isCurrentlyFail = button.classList.contains('selected-fail');

                    if (isCurrentlyFail) {
                        // 目前是失敗 -> 全部切換為成功
                        allButtons.forEach(btn => {
                            btn.classList.remove('selected-fail');
                            btn.classList.add('selected-success');
                        });
                    } else {
                        // 目前是成功 (或預設) -> 全部切換為失敗
                        allButtons.forEach(btn => {
                            btn.classList.remove('selected-success');
                            btn.classList.add('selected-fail');
                        });
                    }
                }
            }

            function handleConfirmVoteClick(e) {
                const button = e.target.closest('.confirm-vote-btn');
                if (!button) return;

                const { round, attempt } = button.dataset;
                const voteAttemptEl = button.closest('.vote-attempt');
                const voteGroup = voteAttemptEl.querySelector('.player-button-group[data-mode="vote"]');
                const resultDisplay = voteAttemptEl.querySelector('.vote-result-display');

                const approveCount = voteGroup.querySelectorAll('.selected').length;
                const rejectCount = activePlayerCount - approveCount;

                let result = '';
                let resultClass = '';

                if (approveCount > rejectCount) {
                    result = `投票通過 (${approveCount} 贊成, ${rejectCount} 反對)`;
                    resultClass = 'pass';
                    // 鎖定此投票
                    lockVoteAttempt(voteAttemptEl);
                    // 顯示任務結果區
                    showMissionResultSection(round, voteAttemptEl);
                } else if (approveCount === rejectCount) {
                    result = `投票平手 (${approveCount} 贊成, ${rejectCount} 反對) - 投票失敗`;
                    resultClass = 'tie';
                    lockVoteAttempt(voteAttemptEl);
                } else {
                    result = `投票否決 (${approveCount} 贊成, ${rejectCount} 反對) - 投票失敗`;
                    resultClass = 'fail';
                    lockVoteAttempt(voteAttemptEl);
                }
                
                resultDisplay.textContent = result;
                resultDisplay.className = `vote-result-display mt-4 ${resultClass}`; // 重置 class
            }

            function lockVoteAttempt(voteAttemptEl) {
                // 禁用所有按鈕
                voteAttemptEl.querySelectorAll('.player-btn').forEach(btn => {
                    btn.style.pointerEvents = 'none'; // 鎖定
                });
                // 隱藏確認按鈕
                voteAttemptEl.querySelector('.confirm-vote-btn').classList.add('hidden');
            }

            function showMissionResultSection(round, voteAttemptEl) {
                const roundLogEl = voteAttemptEl.closest('.round-log');
                const missionSection = roundLogEl.querySelector('.mission-result-section');
                
                // 獲取隊員
                const teamGroup = voteAttemptEl.querySelector('.player-button-group[data-mode="team"]');
                const teamMembers = Array.from(teamGroup.querySelectorAll('.selected')).map(btn => btn.dataset.player);

                // 填充任務按鈕
                const missionBtnGroup = missionSection.querySelector('.player-button-group[data-mode="mission"]');
                missionBtnGroup.innerHTML = createPlayerButtons(teamMembers, 'mission');

                // 顯示任務區
                missionSection.classList.remove('hidden');

                // 隱藏 "新增投票" 按鈕
                roundLogEl.querySelector('.add-vote-attempt-btn').classList.add('hidden');
            }
            
            function handleConfirmMissionClick(e) {
                const button = e.target.closest('.confirm-mission-btn');
                if (!button) return;

                const { round, failsNeeded } = button.dataset;
                const failsNeededNum = parseInt(failsNeeded, 10);
                
                const missionSection = button.closest('.mission-result-section');
                const missionGroup = missionSection.querySelector('.player-button-group[data-mode="mission"]');
                const resultDisplay = missionSection.querySelector('.mission-result-display');
                
                const totalPlayers = missionGroup.querySelectorAll('.player-btn').length;
                const failCount = missionGroup.querySelectorAll('.selected-fail').length;
                const successCount = missionGroup.querySelectorAll('.selected-success').length;

                // 驗證是否所有玩家都已選擇
                if (failCount + successCount !== totalPlayers) {
                    alert('請為所有任務玩家選擇「成功(黃)」或「失敗(黑)」。');
                    return;
                }

                let result = '';
                let resultClass = '';
                
                if (failCount >= failsNeededNum) {
                    result = `任務失敗 ( ${successCount} 成功, ${failCount} 失敗 )`;
                    resultClass = 'fail';
                } else {
                    result = `任務成功 ( ${successCount} 成功, ${failCount} 失敗 )`;
                    resultClass = 'pass';
                }
                
                resultDisplay.textContent = result;
                resultDisplay.className = `mission-result-display mt-4 ${resultClass}`;

                // 鎖定
                missionGroup.querySelectorAll('.player-btn').forEach(btn => {
                    btn.style.pointerEvents = 'none';
                });
                button.classList.add('hidden');
            }


            // --- 10. 事件綁定 (角色攻略) ---
            backButton.addEventListener('click', showSelectionScreen);

            flipCardInner.addEventListener('transitionend', () => {
                if (!flipCardInner.classList.contains('is-flipped')) {
                    selectionDiv.classList.remove('hidden');
                    infoScene.classList.add('hidden');
                }
            });

            notesTextarea.addEventListener('input', () => {
                if (currentRoleKey) {
                    const notesKey = `avalonNote_${currentRoleKey}`;
                    localStorage.setItem(notesKey, notesTextarea.value);
                }
            });

            // --- 11. 初始啟動 ---
            setupTabs(); // 設定分頁
            createCharacterCards(); // 產生角色卡

        });
    </script>

</body>
</html>
