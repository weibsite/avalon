<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿瓦隆 - 角色攻略 (翻牌版)</title>
    <style>
        /* * 全局與佈局 
         */
        :root {
            --good-color: #1565c0; /* 藍色 */
            --evil-color: #c62828; /* 紅色 */
            --bg-light: #f0f2f5;
            --bg-dark: #212121;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--bg-light);
            color: #333;
            margin: 0;
            padding: 20px;
            /* 為了翻牌效果，需要 3D 視角 */
            perspective: 2000px;
            transition: background-color 0.6s;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #1a237e;
            margin-bottom: 25px;
        }

        /* 隱藏/顯示的切換 */
        .hidden {
            display: none !important;
        }
        
        /* * 1. 角色選擇畫面 
         */
        #character-selection {
            padding: 10px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            justify-items: center;
        }

        .role-card {
            width: 100%;
            max-width: 200px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            border: 4px solid transparent;
        }
        
        .role-card.good:hover {
            border-color: var(--good-color);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(21, 101, 192, 0.3);
        }
        
        .role-card.evil:hover {
            border-color: var(--evil-color);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(198, 40, 40, 0.3);
        }

        .role-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .role-card p {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
            padding: 0 10px;
        }

        /* * 2. 角色資訊畫面 (翻牌效果)
         */
        #character-info-scene {
            display: block;
            width: 100%;
            padding-top: 20px;
        }

        .flip-card {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            /* 高度將由內容決定 */
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            /* 設置最小高度以防圖片載入時跳動 */
            min-height: 600px;
        }

        /* 當 .is-flipped 被加入時，執行翻轉 */
        .flip-card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        /* 牌的正面與背面 */
        .flip-card-front,
        .flip-card-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; /* Safari */
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden; /* 確保圓角 */
        }

        /* 牌的正面 (圖片) */
        .flip-card-front {
            background-color: #000;
        }
        
        .flip-card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 填滿容器 */
            border-radius: 12px;
        }

        /* 牌的背面 (資訊) */
        .flip-card-back {
            background-color: var(--card-bg);
            transform: rotateY(180deg);
            padding: 30px;
            box-sizing: border-box; /* 讓 padding 不會撐爆寬度 */
            /* 允許內容過長時滾動 */
            overflow-y: auto;
            height: 100%; 
        }

        #role-name {
            font-size: 28px;
            font-weight: bold;
            margin: 0 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 3px solid;
        }
        
        .good-title { color: var(--good-color); border-color: var(--good-color); }
        .evil-title { color: var(--evil-color); border-color: var(--evil-color); }

        .info-section h3 {
            font-size: 22px;
            color: #555;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .info-section p {
            font-size: 16px;
            line-height: 1.6;
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #ccc;
        }

        .info-section ul {
            list-style-type: none;
            padding-left: 0;
        }

        .info-section li {
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 12px;
            padding-left: 25px;
            position: relative;
        }
        
        .info-section li::before {
            content: '🔹'; /* 列表符號 */
            position: absolute;
            left: 0;
            top: 2px;
            font-size: 14px;
        }
        
        /* 壞人列表用不同符號 */
        .evil-title + .info-section + .info-section li::before,
        .evil-title + .info-section + .info-section + .info-section li::before { /* <!-- 修改：調整CSS選擇器以適應新順序 --> */
            content: '🔺';
        }

        /* 筆記本的 CSS 樣式 */
        #role-notes-textarea {
            width: 100%;
            min-height: 150px;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-family: inherit; /* 繼承 body 的字體 */
            box-sizing: border-box; /* 讓 padding 不會撐爆寬度 */
            resize: vertical; /* 允許使用者垂直調整大小 */
            margin-top: 5px;
            line-height: 1.6;
        }
        #role-notes-textarea:focus {
            outline: none;
            border-color: var(--good-color); /* 聚焦時顯示主題色 */
            box-shadow: 0 0 8px rgba(21, 101, 192, 0.2);
        }


        #back-button {
            margin-top: 30px;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            background-color: #616161;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #back-button:hover {
            background-color: #424242;
        }

        /* <!-- 新增：手機版滿畫面樣式 --> */
        @media (max-width: 768px) {
            body {
                padding: 0;
            }

            h1 {
                padding: 20px 0 10px 0;
                margin-bottom: 15px;
            }
            
            #character-selection {
                padding: 15px;
                box-sizing: border-box;
            }

            #character-info-scene {
                padding-top: 0;
            }

            .flip-card {
                max-width: 100%;
                width: 100%;
                margin: 0;
            }

            .flip-card-inner {
                min-height: 100vh;
                border-radius: 0;
            }

            .flip-card-front,
            .flip-card-back {
                border-radius: 0;
                /* 確保手機版背面可以滾動 */
                overflow-y: auto;
                -webkit-overflow-scrolling: touch; /* 為了 iOS 滾動更流暢 */
                height: 100%;
            }

            .flip-card-back {
                padding: 25px 20px 30px 20px; /* 調整手機內距 */
                box-sizing: border-box;
            }

            #back-button {
                width: 100%; /* 讓返回按鈕滿寬，更易於點擊 */
                padding: 15px 25px; /* 增加按鈕高度 */
            }
        }
        /* <!-- 新增結束 --> */

    </style>
</head>
<body>

    <div class="container">
        
        <div id="character-selection">
            <h1>阿瓦隆 角色攻略</h1>
            <div class="card-grid" id="card-grid-container">
                </div>
        </div>

        <div id="character-info-scene" class="hidden">
            <div class="flip-card" id="flip-card">
                <div class="flip-card-inner" id="flip-card-inner">
                    
                    <div class="flip-card-front" id="info-card-front">
                        </div>
                    
                    <div class="flip-card-back">
                        <h2 id="role-name"></h2>
            
                        <div class="info-section" id="role-knowledge-section">
                            <h3>你知道什麼：</h3>
                            <p id="role-knowledge"></p>
                        </div>
                        
                        <!-- 修改：筆記本區塊移到這裡 -->
                        <div class="info-section" id="role-notes-section">
                            <h3>個人筆記：</h3>
                            <textarea id="role-notes-textarea" placeholder="在這裡記錄玩家的可能性、場上局勢... (內容會自動儲存)"></textarea>
                        </div>
                        <!-- 修改結束 -->

                        <div class="info-section" id="role-strategy-section">
                            <h3>玩法攻略：</h3>
                            <ul id="role-strategy-list">
                                </ul>
                        </div>
                        
                        <button id="back-button">返回角色選擇</button>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // --- 1. 資料庫 ---
            const characterData = {
                'merlin': {
                    name: '梅林 (Merlin)', team: 'good',
                    imageUrl: 'https://andyventure.com/wp-content/uploads/boardgame/avalon/good_people_merlin.webp',
                    knowledge: '你知道所有壞人是誰 (除了莫德雷德)。',
                    strategy: [
                        '<strong>低調！低調！再低調！</strong> 你的首要任務是活到最後不被刺殺。',
                        '<strong>精準投票，模糊發言：</strong> 當隊伍中有壞人時，你應該投「反對」(No)；當隊伍中全是好人時，你才投「贊成」(Yes)。',
                        '<strong>「軟指」壞人：</strong> 不要直接說「A 是壞人」，要用隱晦的方式說：「我覺得這個隊伍不太好」、「我比較信任 B 和 C」。',
                        '<strong>適度裝笨：</strong> 偶爾裝作聽不懂、跟錯風向，讓刺客覺得你只是個普通好人。不要每一輪都表現得像上帝。'
                    ],
                    notesTemplate: '玩家 A: \n玩家 B: \n玩家 C: \n玩家 D: \n玩家 E: \n\n壞人 1: \n壞人 2: \n(莫德雷德是: ?)' // <!-- 新增 -->
                },
                'percival': {
                    name: '派西維爾 (Percival)', team: 'good',
                    imageUrl: 'https://andyventure.com/wp-content/uploads/boardgame/avalon/good_people_percival.webp',
                    knowledge: '你知道「梅林」和「莫甘娜」是哪兩位，但你無法分辨誰是誰。',
                    strategy: [
                        '<strong>辨識真假梅林：</strong> 這是你的核心任務。觀察你的「梅林候選二人組」(梅林與莫甘娜)。',
                        '<strong>觀察投票：</strong> 真正的梅林會在有壞人的隊伍投「反對」。你可以試著提出一個「一好一壞」的隊伍，看那兩位候選人誰投了「反對」。',
                        '<strong>保護梅林：</strong> 找到梅林後，你要像「梅林的保鑣」。主動發言，幫梅林吸引火力。',
                        '<strong>「跳梅」：</strong> 在關鍵時刻，你可以假裝自己是梅林，來誤導刺客，掩護真正的梅林。'
                    ],
                    notesTemplate: '玩家 A: \n玩家 B: \n玩家 C: \n玩家 D: \n玩家 E: \n\n梅林/莫甘娜 1: \n梅林/莫甘娜 2: \n\n推測的梅林是: ' // <!-- 新增 -->
                },
                'loyalServant': {
                    name: '亞瑟的忠臣 (普通好人)', team: 'good',
                    imageUrl: 'https://andyventure.com/wp-content/uploads/boardgame/avalon/good_people_normal.webp',
                    knowledge: '你什麼都不知道，只知道自己是好人。',
                    strategy: [
                        '<strong>觀察投票：</strong> 這是你唯一的線索。誰在否決隊伍？誰的發言前後矛盾？',

                        '<strong>相信邏輯：</strong> 誰在任務失敗後急著指控別人？誰的發言一直很陽光？不要只憑直覺。', // <!-- 修正：logique -> 邏輯 -->
                        '<strong>跳出來：</strong> 如果你很確定，要勇敢帶隊，不要害怕被當成梅林。'
                    ],
                    notesTemplate: '玩家 A: \n玩家 B: \n玩家 C: \n玩家 D: \n玩家 E: \n\n可疑玩家 1: \n可疑玩家 2: \n可信玩家: ' // <!-- 新增 -->
                },
                'mordred': {
                    name: '莫德雷德 (Mordred)', team: 'evil',
                    imageUrl: 'https://andyventure.com/wp-content/uploads/boardgame/avalon/bad_people_mordred.webp',
                    knowledge: '你知道其他壞人隊友 (除了奧伯倫)。梅林看不到你。',
                    strategy: [
                        '<strong>扮演完美的好人：</strong> 由於梅林看不到你，你可以盡情地扮演一個「陽光、正直、帶隊精準」的好人領袖。',
                        '<strong>取得梅林的信任：</strong> 你的目標是讓梅林本人都相信你是好人，甚至主動把你選入任務。',
                        '<strong>關鍵一票：</strong> 在前一兩個任務可以投「成功」(Success) 來博取信任，在第 3 或第 4 個任務（關鍵任務）時再投下致命的「失敗」(Fail)。'
                    ],
                    notesTemplate: '玩家 A: \n玩家 B: \n玩家 C: \n玩家 D: \n玩家 E: \n\n隊友 1: \n隊友 2: \n\n梅林可能是: ' // <!-- 新增 -->
                },
                'morgana': {
                    name: '莫甘娜 (Morgana)', team: 'evil',
                    imageUrl: 'https://andyventure.com/wp-content/uploads/boardgame/avalon/bad_people_morgana.webp',
                    knowledge: '你知道其他壞人隊友 (除了奧伯倫)。在派西維爾眼中，你顯示為「梅林」。',
                    strategy: [
                        '<strong>模仿梅林：</strong> 你的任務是讓派西維爾相信你才是梅林。',
                        '<strong>精準投票：</strong> 假裝你看得懂局勢。在有好人隊伍時投「贊成」，在有其他壞人時投「反對」(但要小心別擋到自己人)。',
                        '<strong>誤導派西維爾：</strong> 發言時要顯得有遠見，但又不能太肯定。讓派西維爾覺得你就是那個「低調的梅林」。',
                        '<strong>必要時「跳梅」：</strong> 在關鍵時刻，你可以跳出來說「我是梅林」，如果派西維爾相信了你，你就成功了。'
                    ],
                    notesTemplate: '玩家 A: \n玩家 B: \n玩家 C: \n玩家 D: \n玩家 E: \n\n隊友 1: \n隊友 2: \n派西維爾是: \n\n模仿梅林投票: ' // <!-- 新增 -->
                },
                'assassin': {
                    name: '刺客 (Assassin)', team: 'evil',
                    imageUrl: 'https://andyventure.com/wp-content/uploads/boardgame/avalon/bad_people_assassin.webp',
                    knowledge: '你知道其他壞人隊友 (除了奧伯倫)。如果好人任務成功 3 次，你還有最後的機會刺殺梅林。',
                    strategy: [
                        '<strong>找出梅林：</strong> 你的唯一目標。梅林通常是那個「投票很準，但發言很水」的人。',
                        '<strong>觀察派西維爾：</strong> 派西維爾在保護誰？他極力想保上任務的人，很可能就是梅林。',
                        '<strong>隱藏自己：</strong> 不要急著跳出來，假裝自己是個普通好人，專心分析。',
                        '<strong>混淆視聽：</strong> 你也可以假裝自己是派西維爾，亂指「梅林候選人」，製造混亂。'
                    ],
                    notesTemplate: '玩家 A: \n玩家 B: \n玩家 C: \n玩家 D: \n玩家 E: \n\n隊友 1: \n隊友 2: \n\n梅林嫌疑 1 (投票準): \n梅林嫌疑 2 (派西保的): \n派西維爾是: ' // <!-- 新增 -->
                },
                'oberon': {
                    name: '奧伯倫 (Oberon)', team: 'evil',
                    imageUrl: 'https://andyventure.com/wp-content/uploads/boardgame/avalon/bad_people_oberon.webp',
                    knowledge: '你是壞人，但你不知道隊友是誰，隊友也不知道你是誰。',
                    strategy: [
                        '<strong>資訊黑洞：</strong> 你是場上的X因素。你的行動會讓好人壞人都很難分析。',
                        '<strong>「笨」壞人：</strong> 你可以假装是個搞不清楚狀況的好人。',
                        '<strong>伺機而動：</strong> 如果有機會上任務，記得要投「失敗」(Fail)。因為隊友不知道你是誰，他們可能不會保你上任務，你必須自己爭取。',
                        '<strong>增加混亂：</strong> 你的存在本身就是對壞人協同的干擾，也是對好人分析的干擾。' // <!-- 修正：移除 'E' -->
                    ],
                    notesTemplate: '玩家 A: \n玩家 B: \n玩家 C: \n玩家 D: \n玩家 E: \n\n可疑玩家 (可能是隊友): \n可疑玩家 (可能是梅林): ' // <!-- 新增 -->
                },
                'minion': {
                    name: '莫德雷德的爪牙 (普通壞人)', team: 'evil',
                    imageUrl: 'https://andyventure.com/wp-content/uploads/boardgame/avalon/bad_people_normal.webp',
                    knowledge: '你知道所有壞人隊友 (除了奧伯倫)。',
                    strategy: [
                        '<strong>保護隊友：</strong> 你的任務是幫助莫甘娜、刺客等核心角色。',
                        '<strong>「丟石頭」：</strong> 互相指控，把水攪混。當一個壞人快被識破時，另一個壞人可以假裝「大義滅親」，指控自己的隊友，來博取好人信任。',
                        '<strong>勇敢投失敗：</strong> 你沒有特殊能力，所以要勇敢上任務並投「失敗」。',
                        '<strong>控制隊長：</strong> 投票給誰當隊長 (King) 非常重要。盡力確保自己的隊友能當上隊長。' // <!-- 修正：移除 'T' -->
                    ],
                    notesTemplate: '玩家 A: \n玩家 B: \n玩家 C: \n玩家 D: \n玩家 E: \n\n隊友 1: \n隊友 2: \n\n要保護的: \n要陷害的: ' // <!-- 新增 -->
                }
            };
            
            let currentRoleKey = null;

            // --- 2. 獲取元素 ---
            const selectionDiv = document.getElementById('character-selection');
            const cardGridContainer = document.getElementById('card-grid-container');
            
            const infoScene = document.getElementById('character-info-scene');
            const flipCardInner = document.getElementById('flip-card-inner');
            const infoCardFront = document.getElementById('info-card-front');
            
            const roleNameEl = document.getElementById('role-name');
            const roleKnowledgeEl = document.getElementById('role-knowledge');
            const roleStrategyListEl = document.getElementById('role-strategy-list');
            const backButton = document.getElementById('back-button');

            const notesTextarea = document.getElementById('role-notes-textarea');


            // --- 3. 核心功能 ---

            function createCharacterCards() {
                cardGridContainer.innerHTML = ''; 
                
                const sortedRoles = Object.entries(characterData).sort(([, a], [, b]) => {
                    if (a.team === b.team) return 0;
                    return a.team === 'good' ? -1 : 1;
                });

                for (const [roleKey, data] of sortedRoles) {
                    const card = document.createElement('div');
                    card.className = `role-card ${data.team}`;
                    card.setAttribute('data-role', roleKey);
                    
                    const displayName = data.name.split(' (')[0]; 
                    
                    card.innerHTML = `
                        <img src="${data.imageUrl}" alt="${data.name}">
                        <p>${displayName}</p>
                    `;
                    
                    card.addEventListener('click', () => showRoleInfo(roleKey));
                    cardGridContainer.appendChild(card);
                }
            }

            function showRoleInfo(roleKey) {
                const data = characterData[roleKey];
                if (!data) return;

                // 1. 填充內容
                infoCardFront.innerHTML = `<img src="${data.imageUrl}" alt="${data.name}">`;
                
                roleNameEl.textContent = data.name;
                roleNameEl.className = data.team === 'good' ? 'good-title' : 'evil-title';
                
                roleKnowledgeEl.textContent = data.knowledge;
                
                roleStrategyListEl.innerHTML = data.strategy.map(item => `<li>${item}</li>`).join('');

                // <!-- 修改：載入筆記 -->
                currentRoleKey = roleKey; 
                const notesKey = `avalonNote_${roleKey}`;
                const savedNotes = localStorage.getItem(notesKey); // 檢查是否存在
                
                if (savedNotes !== null) {
                    // 如果用戶儲存過 (即使是空字串)，就載入用戶的紀錄
                    notesTextarea.value = savedNotes;
                } else {
                    // 如果從未儲存過 (null)，就載入預設模板
                    notesTextarea.value = data.notesTemplate || ''; // 使用模板，如果模板不存在則為空
                }
                // <!-- 修改結束 -->

                // 2. 執行動畫
                selectionDiv.classList.add('hidden'); 
                infoScene.classList.remove('hidden'); 
                document.body.style.backgroundColor = 'var(--bg-dark)'; 

                setTimeout(() => {
                    flipCardInner.classList.add('is-flipped');
                }, 10); 
            }

            function showSelectionScreen() {
                flipCardInner.classList.remove('is-flipped');
                document.body.style.backgroundColor = 'var(--bg-light)'; 

                currentRoleKey = null;
                notesTextarea.blur(); 
            }

            // --- 4. 事件綁定 ---
            backButton.addEventListener('click', showSelectionScreen);

            flipCardInner.addEventListener('transitionend', () => {
                if (!flipCardInner.classList.contains('is-flipped')) {
                    selectionDiv.classList.remove('hidden');
                    infoScene.classList.add('hidden');
                }
            });

            notesTextarea.addEventListener('input', () => {
                if (currentRoleKey) {
                    const notesKey = `avalonNote_${currentRoleKey}`;
                    localStorage.setItem(notesKey, notesTextarea.value);
                }
            });

            // --- 5. 初始啟動 ---
            createCharacterCards();

        });
    </script>

</body>
</html>
